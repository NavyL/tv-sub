name: sync

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:
  push:
    paths: ["sources.json", "picks.json", "sync.py", "lives.json", "lives.py", "logos.py", "epg.py", ".github/workflows/sync.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge public live lists
        run: python lives.py
        continue-on-error: true

      - name: Fetch missing channel logos
        run: python logos.py
        continue-on-error: true

      - name: Fetch and decode upstream sources
        id: sync
        run: python sync.py
        continue-on-error: true

      - name: Commit if changed
        id: commit
        if: steps.sync.outcome == 'success'
        run: |
          git add -A
          # status.json carries a timestamp and always differs; commit only when something else changed
          if git diff --cached --quiet -- . ':!status.json'; then
            git reset -q
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in best.json multi.json tv.json status.json output/*.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$f" -o /dev/null || true
          done

      # EPG for the live lists: rebuilt on every run (not committed), so Pages always carries fresh programme data.
      - name: Build EPG
        run: python epg.py
        continue-on-error: true

      # GitHub Pages copy: same files, refreshed within ~10 minutes of a change (jsDelivr @main lags for hours).
      # Deployed on every run so the EPG stays fresh even when nothing else changed.
      - name: Build Pages site
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          pages="https://${owner,,}.github.io/${repo}"
          rm -rf site && mkdir -p site/output
          cp best.json tv.json status.json shield.json shield-best.json site/
          cp output/*.json site/output/
          [ -d wallpaper ] && cp -r wallpaper site/
          mkdir -p site/live && cp live/*.txt site/live/
          [ -f live/epg.xml.gz ] && cp live/epg.xml.gz site/live/
          [ -d logo ] && cp -r logo site/
          sed "s#https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main#${pages}#g" multi.json > site/multi.json
          printf '<!doctype html><meta charset="utf-8"><title>tv-sub</title><h3>点播</h3><p><a href="best.json">best.json</a> · <a href="multi.json">multi.json</a> · <a href="tv.json">tv.json</a> · <a href="status.json">status.json</a><h3>直播</h3><p>%s<p>节目单 <a href="live/epg.xml.gz">live/epg.xml.gz</a> · 台标 logo/{频道名}.png' "$(for f in live/*.txt; do printf '<a href="%s">%s</a> · ' "$f" "$(basename "$f")"; done)" > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: pages
